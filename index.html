<style>
/* Concept: dark stage, one accent, geometric shapes as the only ornament.
   The canvas card is the product; the page around it stays quiet. */
:root{
  color-scheme:dark;
  --bg:#0C1634;
  --surface:#14214a;
  --fg:#F2F5FF;
  --muted:#9FB0DC;
  --line:rgba(163,191,232,.22);
  --accent:#6E8EE1;
  --accent-ink:#0C1634;
  --s1:#ff8fcf; --s2:#1fd96b; --s3:#fff25a; --s4:#3b2cff; --s5:#8a2be2;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{padding-inline:20px}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Language switch ---------- */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.lang button:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- Home ---------- */
.home{position:relative;max-width:460px;margin:0 auto;padding-block:28px 48px;isolation:isolate;overflow:hidden}
.home::before{content:"";position:absolute;inset:-20% -40% auto -40%;height:70%;background:radial-gradient(60% 60% at 70% 20%,rgba(80,108,206,.55),transparent 70%);z-index:-2}
.floaters{position:absolute;inset:0;z-index:-1;pointer-events:none}
.floaters svg{position:absolute;width:var(--w);height:var(--w);fill:var(--c);opacity:.95;animation:float var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes float{from{transform:translateY(-8px) rotate(var(--r0))}to{transform:translateY(10px) rotate(var(--r1))}}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:44px}
.brand{display:block;height:34px;width:auto}
.badge{display:inline-block;margin:0 0 14px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0 0 14px;font-size:clamp(34px,10vw,46px);line-height:1.02;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.lead{margin:0 0 30px;max-width:30ch;font-size:16px;line-height:1.5;font-weight:300;color:#D5DEF7}
form{display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px;border:0;padding:0;margin:0;min-width:0}
.field>span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field em{font-style:normal;font-weight:400;letter-spacing:.06em;text-transform:none;margin-left:8px;opacity:.8}
input[type=text],input[type=email],input[type=month],input[type=date]{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:500;outline:0;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#6f7fb0;font-weight:400}
input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.photo{display:flex;align-items:center;gap:16px;padding:12px;border:1px dashed var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s}
.photo:hover,.photo:focus-within{border-color:var(--accent);background:var(--surface)}
.pv{flex:none;width:68px;height:68px;border-radius:50%;background:var(--surface) center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.pv svg{width:34px;height:34px;fill:var(--accent)}
.pt{display:flex;flex-direction:column;gap:3px;min-width:0}
.pt b{font-size:15px;font-weight:700}
.pt small{font-size:12px;line-height:1.4;color:var(--muted)}
.cta{margin-top:6px;padding:17px 20px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:transform .15s,opacity .2s,filter .2s}
.cta:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
.cta:disabled{opacity:.35;cursor:not-allowed}
.cta:focus-visible,.btn:focus-visible,.skip:focus-visible{outline:3px solid #fff;outline-offset:3px}
.note{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.hero>*,form>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero>*:nth-child(2){animation-delay:.06s}.hero>*:nth-child(3){animation-delay:.12s}.hero>*:nth-child(4){animation-delay:.18s}
form>*:nth-child(1){animation-delay:.24s}form>*:nth-child(2){animation-delay:.3s}form>*:nth-child(3){animation-delay:.36s}form>*:nth-child(4){animation-delay:.42s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- Story ---------- */
.story{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9))}
.stage canvas{display:block;width:100%;height:100%}
.bars{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;right:14px;display:flex;gap:4px;z-index:2}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.tap{position:absolute;top:0;bottom:0;border:0;background:transparent;cursor:pointer;z-index:1}
.tap.prev{left:0;width:30%}.tap.next{right:0;width:70%}
.skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 26px);right:14px;z-index:3;padding:8px 12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(0,0,0,.35);font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer}

/* ---------- Result ---------- */
.result{max-width:460px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
.rtop{display:flex;justify-content:flex-end}
.cardwrap{border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);aspect-ratio:9/16;background:#000}
.cardwrap canvas{display:block;width:100%;height:100%}
.tools{display:flex;flex-direction:column;gap:18px}
.range{display:flex;flex-direction:column;gap:10px}
.range>span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.status{min-height:1.4em;margin:0;font-size:13px;color:var(--muted)}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.msg{display:flex;flex-direction:column;gap:12px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.msg h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.msg p{margin:0;font-size:17px;line-height:1.55;font-weight:300;font-style:italic;text-wrap:pretty}

.demo{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px}
.demo p{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;transition:border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.nav{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 3.2%);display:flex;justify-content:center;gap:16px;z-index:3;pointer-events:none}
.arr{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .15s,opacity .2s}
.arr svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.arr:hover:not(:disabled){background:rgba(110,142,225,.28);transform:scale(1.06)}
.arr:disabled{opacity:.3;cursor:default}
.arr:focus-visible{outline:3px solid #fff;outline-offset:3px}

function norm(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  var m=/^(\d{4})-(\d{2})$/.exec(v||'');if(!m)return 0;

var CKEYS={us:'US',usa:'US','united states':'US','estados unidos':'US',eeuu:'US','ee uu':'US',gb:'GB',uk:'GB','united kingdom':'GB','reino unido':'GB',de:'DE',germany:'DE',alemania:'DE',es:'ES',spain:'ES',espana:'ES',ca:'CA',canada:'CA',cl:'CL',chile:'CL',cy:'CY',cyprus:'CY',chipre:'CY',ec:'EC',ecuador:'EC',mx:'MX',mexico:'MX',pr:'PR','puerto rico':'PR',se:'SE',sweden:'SE',suecia:'SE'};
function areaKey(txt){
  var n=norm(txt||'');if(!n)return '';
  for(var k in CFG.areas){var a=CFG.areas[k];if(norm(k)===n||norm(a.es)===n||norm(a.en)===n)return k}
  var dk='x_'+n.replace(/[^a-z0-9]+/g,'_');CFG.areas[dk]={es:String(txt).trim(),en:String(txt).trim()};return dk;
}
function personToMatch(p,email){
  var parts=String(p.country||'').split(/[,;\/|&+]| y | and /i).map(function(x){return norm(x)}).filter(Boolean),c=parts.length===1?(CKEYS[parts[0]]||''):'';
  return {name:p.name,email:email,start:p.start||'',area:areaKey(p.area),country:c,msg:{es:p.msg&&p.msg.es||'',en:p.msg&&p.msg.en||''},shine:{es:p.shine&&p.shine.es||'',en:p.shine&&p.shine.en||''}};
}
function lookupPerson(){
  var local=findMatch();if(local)return Promise.resolve({m:local});
  if(!CFG.endpoint)return Promise.resolve({m:null});
  var ctrl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctrl)ctrl.abort()},10000);
  return fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name:state.name,email:(state.email||'').trim().toLowerCase()}),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json()})
    .then(function(j){clearTimeout(timer);if(!j||!j.ok)throw new Error('bad');return {m:j.found&&j.person?personToMatch(j.person,state.email):null}})
    .catch(function(){clearTimeout(timer);return {m:null,err:true}});
}
function messageFor(){
  var m=state.match&&state.match.msg,t=(m&&(m[state.lang]||m.es||m.en))||T('sampleMsg');

}
function renderWordChips(){

function generate(){
  var r=rng(hash(norm(state.name)+'|'+state.seed)),n=function(len){return Math.floor(r()*len)},P=CFG.pools.es;
  state.pick={word:n(CFG.words.es.length),skills:n(P.skills.length)};

function buildStats(){
  var L='es',P=CFG.pools.es,pk=state.pick,mt=state.match;if(!pk)return;
  state.word=state.wordCustom||CFG.words.es[pk.word];
  var st=[];
  st.push({icon:'ar',text:T('impactAr')});
  var cm=CFG.comercios;st.push({icon:'evo',text:T('evoText').replace('{n}',cm)});
  var ar=mt&&mt.area&&CFG.areas[mt.area];
  if(ar)st.push({icon:'rocket',text:T('areaText').replace('{area}',ar.es)});
  var si=pk.skills;if(mt&&mt.area==='comms'&&si===1)si=2;
  var sh=mt&&mt.shine&&(mt.shine.es||'');
  if(sh){sh=String(sh).trim().replace(/\*+/g,'');st.push({icon:'star',text:'Te luciste con **'+sh+'**'})}

}

/* ---------- rich text ---------- */
function parseRich(t){
  var out=[];t.split(/(\*\*[^*]+\*\*)/).forEach(function(part){
    if(!part)return;var b=part.indexOf('**')===0;var s=b?part.slice(2,-2):part;
    s.split(/\s+/).filter(Boolean).forEach(function(w){out.push({t:b?w.toUpperCase():w,b:b})});
  });return out;
}
function layoutRich(c,text,maxW,size,wL,wB,it,brk){
  var words=parseRich(text),lines=[],cur={ws:[],w:0};
  c.font=F(wL,size,it);var sp=c.measureText(' ').width;
  words.forEach(function(wd){
    if(wd.t==='¶'){if(cur.ws.length){lines.push(cur);cur={ws:[],w:0}}return}
    if(brk&&wd.b&&cur.ws.length&&!cur.ws[cur.ws.length-1].b){lines.push(cur);cur={ws:[],w:0}}
    c.font=F(wd.b?wB:wL,size,it);var ww=c.measureText(wd.t).width;
    if(cur.ws.length&&cur.w+sp+ww>maxW){lines.push(cur);cur={ws:[],w:0}}
    cur.w+=(cur.ws.length?sp:0)+ww;cur.ws.push({t:wd.t,b:wd.b,ww:ww});
  });
  if(cur.ws.length)lines.push(cur);lines.sp=sp;return lines;
}
function drawLine(c,line,x,y,align,size,wL,wB,colL,colB,sp,it){
  var sx=align==='center'?x-line.w/2:x;c.textBaseline='middle';c.textAlign='left';
  line.ws.forEach(function(wd,i){c.font=F(wd.b?wB:wL,size,it);c.fillStyle=wd.b?colB:colL;c.fillText(wd.t,sx,y);sx+=wd.ww+(i<line.ws.length-1?sp:0)});
}

  appear(c,ease(seg(lt,0,.5)),20,function(){c.font=F(700,32);c.fillStyle=C.accent;c.textAlign='center';c.textBaseline='middle';setLS(c,'9px');c.fillText(T('msgKicker'),W/2+4,430);setLS(c,'0px')});
  var lines=layoutRich(c,state.msg,860,56,300,300,true),n=lines.length,y0=930-(n-1)*44;
  lines.forEach(function(ln,i){appear(c,ease(seg(lt,.5+i*.16,1.1+i*.16)),30,function(){drawLine(c,ln,W/2,y0+i*88,'center',56,300,300,C.fg,C.fg,lines.sp,true)})});
  var la=ease(seg(lt,.9+n*.16,1.5+n*.16));
  if(la>0){c.save();c.globalAlpha*=la;c.fillStyle='rgba(255,255,255,.85)';c.fillRect(W/2-60,y0+n*88-10,120,4);c.restore();drawLogoAt(c,W/2,y0+n*88+90,Math.min(CFG.logoW*1.3,420),la)}
  c.restore();
}

/* ---------- loop ---------- */
var mode='home',sceneIdx=0,sceneT0=0,cardT0=0,raf=0,dirty=true;
function sceneText(i){var sc=scenes[i];return sc.kind==='hello'?dispName()+', '+T('subTail')+' '+state.word:sc.kind==='msg'?state.msg:statText(sc.s,1).replace(/\*\*/g,'').replace(/ ?¶ ?/g,' ')}
function buildBars(){
  var b=$('#bars');b.innerHTML='';scenes.forEach(function(){var d=document.createElement('div');d.className='bar';d.appendChild(document.createElement('i'));b.appendChild(d)});
}
function setBars(frac){
  var bars=$('#bars').children;for(var i=0;i<bars.length;i++){bars[i].firstChild.style.width=(i<sceneIdx?100:i===sceneIdx?Math.round(frac*100):0)+'%'}
}
function gotoScene(i){
  if(i<0)i=0;if(i>=scenes.length){showResult();return}
  sceneIdx=i;sceneT0=performance.now();var np=$('#navPrev');if(np)np.disabled=i===0;$('#live').textContent=sceneText(i);
}
function tick(now){
  raf=requestAnimationFrame(tick);var t=now/1000;
  if(mode==='story'){
    var sc=scenes[sceneIdx],lt=(now-sceneT0)/1000;
    if(sc.kind==='hello')drawHello(ctx,lt,sc.dur,t);else{drawBackground(ctx,t,sc.kind==='msg'?.14:1);if(sc.kind==='msg')drawMsgScene(ctx,lt,sc.dur);else drawStatScene(ctx,sc.s,lt,sc.dur)}
    setBars(clamp(lt/sc.dur));
    if(lt>=sc.dur)gotoScene(sceneIdx+1);
  }else if(mode==='card'){
    var p=reduced?1:clamp((now-cardT0)/3400);
    if(reduced&&!dirty)return;
    drawCard(ctx,p,reduced?0:t);dirty=false;
  }
}
function startLoop(){if(!raf)raf=requestAnimationFrame(tick)}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function show(id){['#home','#story','#result'].forEach(function(s){$(s).hidden=s!==id});window.scrollTo(0,0)}
function startStory(){
  generate();buildScenes();buildBars();
  if(reduced){showResult();return}
  mode='story';$('#storyStage').insertBefore(cv,$('#storyStage').firstChild);show('#story');gotoScene(0);startLoop();
}
function showResult(){
  mode='card';cardT0=performance.now();dirty=true;
  $('#resultStage').appendChild(cv);show('#result');
  $('#word').value=state.word;$('#msgText').textContent=state.msg;setMatchNote();renderWordChips();$('#posWrap').hidden=!state.photo;$('#pos').value=Math.round(state.photoY*100);
  $('#status').textContent='';setupCue();startLoop();
}
function reviewStory(){
  buildScenes();buildBars();mode='story';$('#storyStage').insertBefore(cv,$('#storyStage').firstChild);show('#story');gotoScene(0);startLoop();
}
var cueObs=null;
function setupCue(){
  var cue=$('#cue'),t=$('#dl');if(!cue||!t)return;if(cueObs){cueObs.disconnect();cueObs=null}
  cue.hidden=false;cue.classList.remove('off');
  if('IntersectionObserver' in window){cueObs=new IntersectionObserver(function(es){cue.classList.toggle('off',es[0].isIntersecting)},{threshold:.6});cueObs.observe(t)}
}
function goHome(){mode='home';stopLoop();show('#home')}

/* ---------- inputs ---------- */
(function init(){
  var name=$('#name'),go=$('#go');
  $$('.lang button').forEach(function(b){b.addEventListener('click',function(){state.lang=b.getAttribute('data-lang');applyLang()})});
  var dob=$('#email');
  function sync(){state.name=name.value.trim();state.email=dob.value.trim();go.disabled=!(state.name&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(state.email))}
  name.addEventListener('input',sync);dob.addEventListener('input',sync);dob.addEventListener('change',sync);
  var chips=$('#chips');
  CFG.roster.forEach(function(r){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=r.name;b.addEventListener('click',function(){name.value=r.name;dob.value=r.email;sync()});chips.appendChild(b)});
  function loadPhoto(f){
    if(!f)return;
    var url=URL.createObjectURL(f),im=new Image();
    im.onload=function(){
      if(state.photoUrl)URL.revokeObjectURL(state.photoUrl);
      state.photo=im;state.photoUrl=url;state.photoY=.35;var pv=$('#pv');pv.style.backgroundImage='url("'+url+'")';pv.innerHTML='';
      var pw=$('#posWrap');if(pw){pw.hidden=false;$('#pos').value=35}
      setPhotoBtn();cardT0=performance.now();dirty=true;
    };
    im.onerror=function(){URL.revokeObjectURL(url)};im.src=url;
  }
  $('#photo').addEventListener('change',function(e){loadPhoto(e.target.files&&e.target.files[0])});
  $('#photoBtn2').addEventListener('click',function(){$('#photo2').click()});
  $('#photo2').addEventListener('change',function(e){loadPhoto(e.target.files&&e.target.files[0]);e.target.value=''});
  $('#form').addEventListener('submit',function(e){e.preventDefault();sync();if(!state.name){name.focus();return}if(go.disabled){dob.focus();return}go.disabled=true;go.textContent=T('searching');
    Promise.all([lookupPerson(),fontsReady]).then(function(res){state.match=res[0].m;state.lookupErr=!!res[0].err;go.textContent=T('cta');sync();startStory()});
  });
  $('#next').addEventListener('click',function(){gotoScene(sceneIdx+1)});
  $('#prev').addEventListener('click',function(){gotoScene(sceneIdx-1)});
  $('#skip').addEventListener('click',showResult);
  $('#navPrev').addEventListener('click',function(){gotoScene(sceneIdx-1)});
  $('#navNext').addEventListener('click',function(){gotoScene(sceneIdx+1)});
  document.addEventListener('keydown',function(e){
    if(mode!=='story')return;
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();gotoScene(sceneIdx+1)}
    else if(e.key==='ArrowLeft')gotoScene(sceneIdx-1);else if(e.key==='Escape')showResult();
  });
  $('#word').addEventListener('input',function(e){var v=e.target.value.trim();state.wordCustom=v||null;state.word=v||CFG.words.es[state.pick.word];renderWordChips();dirty=true});
  $('#pos').addEventListener('input',function(e){state.photoY=e.target.value/100;dirty=true});
  $('#back').addEventListener('click',goHome);
  $('#cue').addEventListener('click',function(){$('#dl').scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'})});
  var rv=$('#review');rv.addEventListener('click',reviewStory);if(reduced)rv.hidden=true;
  $('#dl').addEventListener('click',download);
  applyLang();
})();

function slug(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'wrapped'}
async function download(){
  var st=$('#status');st.textContent=T('preparing');
  try{
    await fontsReady;
    var off=document.createElement('canvas');off.width=W;off.height=H;drawCard(off.getContext('2d'),1,0);
    var blob=await new Promise(function(r){off.toBlob(r,'image/png')});
    if(!blob)throw new Error('blob');
    var fname=CFG.file+'-'+slug(state.name)+'-'+state.lang+'.png',dl=null;
    try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
    if(dl){
      try{await dl.save({filename:fname,data:blob});st.textContent=T('done')}
      catch(err){st.textContent=err&&err.code==='declined'?T('declined'):T('saveFail')}
    }else{
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
      st.textContent=T('saved2');
    }
  }catch(e){st.textContent=T('failed')}
}
})();
</script>
